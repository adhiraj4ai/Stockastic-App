version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: stockastic-postgres
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stockastic
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - stockastic-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d stockastic" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: stockastic-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - stockastic-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockastic-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stockastic-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/admin/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker (Backend tasks)
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockastic-celery
    command: celery -A stockastic worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - stockastic-network
    healthcheck:
      test: [ "CMD-SHELL", "celery -A stockastic inspect ping || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ML Service Celery Worker (Forecast/ML tasks)
  ml_service_celery:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: stockastic-ml-celery
    command: celery -A ml_service worker --loglevel=info -Q ml_tasks
    volumes:
      - ./ml_service:/app
      - ml_models:/app/ml_models
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml_service:
        condition: service_healthy
    networks:
      - stockastic-network
    healthcheck:
      test: [ "CMD-SHELL", "celery -A ml_service inspect ping || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ML Service (Separate Django app for forecasting)
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: stockastic-ml-service
    command: python manage.py runserver 0.0.0.0:8001
    volumes:
      - ./ml_service:/app
      - ml_models:/app/ml_models
    ports:
      - "8001:8001"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stockastic-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8001/admin/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_ML_SERVICE_URL: http://localhost:8001
    container_name: stockastic-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_ML_SERVICE_URL=http://localhost:8001
    depends_on:
      - backend
    networks:
      - stockastic-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider http://localhost:3000 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ml_models:
    driver: local

networks:
  stockastic-network:
    driver: bridge
