services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: stockastic-postgres
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stockastic
    volumes:
      - postgres_data:/var/lib/postgresql/data
#    ports:
#      - "5432:5432"
    networks:
      - stockastic-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d stockastic" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: stockastic-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
#    ports:
#      - "6379:6379"
    networks:
      - stockastic-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    user: "1000:1000"
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockastic-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - NEPSE_API_BASE_URL=${NEPSE_API_BASE_URL:-https://nepseapi.surajrimal.dev}
      - NEPSE_API_PROVIDER=${NEPSE_API_PROVIDER:-nepseapi}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stockastic-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/admin/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker (Backend tasks)
  celery:
    user: "1000:1000"
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockastic-celery
    command: celery -A stockastic worker -B --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - stockastic-network
    healthcheck:
      test: [ "CMD-SHELL", "celery -A stockastic inspect ping || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: stockastic-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - stockastic-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider http://localhost:3000 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional self-hosted NepseAPI. Uncomment and set NEPSE_API_BASE_URL=http://nepseapi:8000
  # in the backend service to use it instead of the public instance.
  # nepseapi:
  #   image: surajrimal/nepseapi:latest
  #   container_name: stockastic-nepseapi
  #   ports:
  #     - "8001:8000"   # host 8001 -> container 8000 (avoids Django's 8000)
  #   restart: unless-stopped

  # Ngrok Tunnel Service
  ngrok:
    image: ngrok/ngrok:alpine
    container_name: stockastic-ngrok
    env_file:
      - .env.docker
    command: http frontend:3000 --log=stdout
    ports:
      - "4040:4040"
    depends_on:
      - frontend
    networks:
      - stockastic-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ml_models:
    driver: local
  ollama_data:
    driver: local

networks:
  stockastic-network:
    driver: bridge
